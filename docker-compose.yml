version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: catalyst
      POSTGRES_PASSWORD: catalyst
      POSTGRES_DB: catalyst
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+asyncpg://catalyst:catalyst@postgres:5432/catalyst
      REDIS_URL: redis://redis:6379/0
      LLM_PROVIDER: mock
      CORS_ORIGINS: '["http://localhost:3000"]'
    depends_on:
      - postgres
      - redis
    ports:
      - "8000:8000"

  web:
    build: ./frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on:
      - api
    ports:
      - "3000:3000"

volumes:
  pgdata:
